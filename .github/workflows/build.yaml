name: Build

on:
  push:
    tags: [ '**' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - uses: nuget/setup-nuget@v2
      with:
        nuget-version: latest
    - uses: actions/setup-python@v5
      with:
        python-version: 3.9
    - run: |
        cd translate
        pip install -r requirements.txt
        ./gen_rc.sh
      shell: bash
    - run: nuget restore AudioPlaybackConnector.sln
    - name: Build x64
      shell: powershell
      run: |
        $out = msbuild AudioPlaybackConnector.sln "-p:Configuration=Release;Platform=x64" 2>&1
        $code = $LASTEXITCODE
        $out | ForEach-Object { Write-Host $_ }
        $out | Select-String -Pattern 'error [A-Z]+[0-9]+' | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
        if ($code -ne 0) { exit $code }
    - name: Build x86
      shell: powershell
      run: |
        $out = msbuild AudioPlaybackConnector.sln "-p:Configuration=Release;Platform=x86" 2>&1
        $code = $LASTEXITCODE
        $out | ForEach-Object { Write-Host $_ }
        $out | Select-String -Pattern 'error [A-Z]+[0-9]+' | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
        if ($code -ne 0) { exit $code }
    - uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnector64
        path: |
          x64/Release/AudioPlaybackConnector64.exe
          x64/Release/AudioPlaybackConnector64.pdb
    - uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnector32
        path: |
          Release/AudioPlaybackConnector32.exe
          Release/AudioPlaybackConnector32.pdb
