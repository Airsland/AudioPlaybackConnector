name: Build

on:
  push:
    tags: [ '**' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - uses: nuget/setup-nuget@v2
      with:
        nuget-version: latest
    - uses: actions/setup-python@v5
      with:
        python-version: 3.9
    - run: |
        cd translate
        pip install -r requirements.txt
        ./gen_rc.sh
      shell: bash
    - run: nuget restore AudioPlaybackConnector.sln
    - run: |
        Start-Job -Init ([ScriptBlock]::Create("Set-Location '$pwd'")) -Script {
          msbuild AudioPlaybackConnector.sln "-p:Configuration=Release;Platform=x64" }
        Start-Job -Init ([ScriptBlock]::Create("Set-Location '$pwd'")) -Script {
          msbuild AudioPlaybackConnector.sln "-p:Configuration=Release;Platform=x86" }
        Start-Job -Init ([ScriptBlock]::Create("Set-Location '$pwd'")) -Script {
          msbuild AudioPlaybackConnector.sln "-p:Configuration=Release;Platform=ARM64" }
        Start-Job -Init ([ScriptBlock]::Create("Set-Location '$pwd'")) -Script {
          msbuild AudioPlaybackConnector.sln "-p:Configuration=Release;Platform=ARM" }
        Get-Job | Wait-Job | Receive-Job
      shell: powershell
    - uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnector64
        path: |
          x64/Release/AudioPlaybackConnector64.exe
          x64/Release/AudioPlaybackConnector64.pdb
    - uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnector32
        path: |
          Release/AudioPlaybackConnector32.exe
          Release/AudioPlaybackConnector32.pdb
    - uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnectorARM64
        path: |
          ARM64/Release/AudioPlaybackConnectorARM64.exe
          ARM64/Release/AudioPlaybackConnectorARM64.pdb
    - uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnectorARM
        path: |
          ARM/Release/AudioPlaybackConnectorARM.exe
          ARM/Release/AudioPlaybackConnectorARM.pdb
    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --repo "${{ github.repository }}" || true
    - name: Upload Release Asset (x64)
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.ref_name }}" x64/Release/AudioPlaybackConnector64.exe x64/Release/AudioPlaybackConnector64.pdb --clobber --repo "${{ github.repository }}"
    - name: Upload Release Asset (x86)
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.ref_name }}" Release/AudioPlaybackConnector32.exe Release/AudioPlaybackConnector32.pdb --clobber --repo "${{ github.repository }}"
    - name: Upload Release Asset (ARM64)
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.ref_name }}" ARM64/Release/AudioPlaybackConnectorARM64.exe ARM64/Release/AudioPlaybackConnectorARM64.pdb --clobber --repo "${{ github.repository }}"
    - name: Upload Release Asset (ARM)
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.ref_name }}" ARM/Release/AudioPlaybackConnectorARM.exe ARM/Release/AudioPlaybackConnectorARM.pdb --clobber --repo "${{ github.repository }}"
